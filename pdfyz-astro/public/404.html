<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found — PDF-YZ</title>
    <!-- Une 404 doit rester hors de l'index : sinon elle apparaît dans les
         résultats à la place de la page qu'on cherchait. -->
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#0c0c0f" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png" />
    <link rel="stylesheet" href="vendor/fonts/app.css" />
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            margin: 0; display: grid; place-items: center; padding: 32px;
            background: #0c0c0f; color: #f6f6f8;
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        main { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 0; max-width: 44ch; }
        img { width: clamp(64px, 12vh, 96px); height: auto; margin-bottom: 26px; }
        h1 {
            margin: 0 0 10px; font-size: clamp(20px, 3.4vh, 26px); font-weight: 700;
            letter-spacing: 0.02em;
        }
        p { margin: 0 0 8px; font-size: 14px; line-height: 1.6; color: #a6a6b1; }
        .code { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; color: #85858f; }
        a.cta {
            margin-top: 26px; display: inline-flex; align-items: center; gap: 8px;
            padding: 11px 20px; border-radius: 10px; text-decoration: none;
            background: #ffffff; color: #0b0b0e; font-size: 13px; font-weight: 600;
            transition: opacity 0.15s ease;
        }
        a.cta:hover { opacity: 0.88; }
        a.cta:focus-visible { outline: 2px solid #ffffff; outline-offset: 3px; }
    </style>
</head>
<body>
    <main>
        <img src="logo-pdf-yz.svg" alt="PDF-YZ" width="96" height="96" />
        <h1>This page does not exist</h1>
        <p>The address you opened is not part of PDF-YZ. The editor itself is one page — everything happens there.</p>
        <p class="code">HTTP 404 · Not Found</p>
        <a class="cta" href="./">Back to the editor</a>
    </main>
</body>
</html>
